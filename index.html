<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision TP UNICA — Python & C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#22c55e;--green-dark:#16a34a;--green-light:#bbf7d0;--blue:#38bdf8;--blue-dark:#0284c7;--bg:#f0fdf4;--white:#ffffff;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;--shadow:0 2px 8px rgba(0,0,0,0.08);--shadow-lg:0 8px 24px rgba(0,0,0,0.12);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--gray-900);min-height:100vh;}
.header{background:linear-gradient(135deg,#16a34a 0%,#0ea5e9 100%);padding:28px 32px 40px;color:white;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:rgba(255,255,255,0.05);border-radius:50%;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:900;color:white;}
.score-badge{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);border-radius:20px;padding:6px 16px;font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:6px;}
.header h1{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;margin-bottom:8px;}
.header p{font-size:0.95rem;opacity:0.9;margin-bottom:20px;}
.header-badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.header-badge{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:5px 14px;font-size:0.8rem;font-weight:700;}
.search-wrap{position:relative;max-width:700px;}
.search-input{width:100%;padding:16px 20px 16px 50px;border-radius:16px;border:3px solid rgba(255,255,255,0.5);background:white;font-family:'Nunito',sans-serif;font-size:1rem;color:var(--gray-700);outline:none;transition:border-color 0.2s;box-shadow:var(--shadow-lg);}
.search-input:focus{border-color:var(--green);}
.search-input::placeholder{color:var(--gray-300);}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.2rem;}
.layout{display:flex;gap:24px;max-width:1300px;margin:-20px auto 0;padding:0 24px 60px;align-items:flex-start;}
.sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;}
.card{background:white;border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-500);margin-bottom:14px;}
.prog-row{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--gray-500);margin-bottom:8px;}
.prog-bar{height:8px;background:var(--gray-100);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:10px;transition:width 0.4s;width:0%;}
.prog-counts{display:flex;justify-content:space-around;text-align:center;}
.prog-num{font-size:1.4rem;font-weight:900;}
.prog-num.green{color:var(--green-dark);}
.prog-num.gray{color:var(--gray-500);}
.prog-label{font-size:0.7rem;color:var(--gray-500);font-weight:700;text-transform:uppercase;}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background 0.15s;font-size:0.83rem;font-weight:600;}
.cat-item:hover{background:var(--gray-50);}
.cat-item.active{background:var(--green-light);}
.cat-left{display:flex;align-items:center;gap:8px;}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cat-count{background:var(--gray-100);border-radius:10px;padding:2px 8px;font-size:0.75rem;font-weight:700;color:var(--gray-500);}
.cat-item.active .cat-count{background:white;color:var(--green-dark);}
.main{flex:1;min-width:0;}
.results-count{font-size:0.85rem;color:var(--gray-500);font-weight:600;margin-bottom:14px;padding-top:8px;}
.exo-card{background:white;border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;border:2px solid transparent;}
.exo-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.exo-card.open{border-color:var(--green);}
.exo-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;}
.exo-num{width:44px;height:44px;border-radius:12px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:800;color:var(--gray-500);flex-shrink:0;}
.exo-num.py{background:#dbeafe;color:#1d4ed8;}
.exo-num.cpp{background:#fce7f3;color:#be185d;}
.exo-info{flex:1;min-width:0;}
.exo-title{font-size:0.95rem;font-weight:700;color:var(--gray-900);margin-bottom:5px;}
.exo-tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;}
.tag-py{background:#dbeafe;color:#1d4ed8;}.tag-cpp{background:#fce7f3;color:#be185d;}
.tag-easy{background:#dcfce7;color:#15803d;}.tag-medium{background:#fef9c3;color:#a16207;}.tag-hard{background:#fee2e2;color:#b91c1c;}
.tag-tp1{background:#ede9fe;color:#6d28d9;}.tag-tp2{background:#fce7f3;color:#be185d;}.tag-tp3{background:#fef3c7;color:#b45309;}.tag-tp4{background:#dcfce7;color:#15803d;}.tag-tp5{background:#e0f2fe;color:#0369a1;}
.exo-chevron{color:var(--gray-300);font-size:0.8rem;transition:transform 0.3s;flex-shrink:0;}
.exo-card.open .exo-chevron{transform:rotate(180deg);color:var(--green);}
.exo-body{display:none;border-top:2px solid var(--gray-100);padding:20px;}
.exo-card.open .exo-body{display:block;}
.enonce{background:#f0fdf4;border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:16px;font-size:0.88rem;line-height:1.7;color:var(--gray-700);}
.enonce strong{color:var(--gray-900);}
.enonce code{background:#e0f2fe;color:#0284c7;padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:0.85em;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.correction-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,var(--green),var(--blue-dark));color:white;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:opacity 0.2s;}
.correction-btn:hover{opacity:0.9;}
.resolve-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:white;border:2px solid var(--green);border-radius:10px;color:var(--green-dark);font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.resolve-btn:hover{background:var(--green);color:white;}
.resolve-btn.resolved{background:var(--green);color:white;}
.correction-block{display:none;}
.correction-block.visible{display:block;animation:fadeIn 0.3s ease;}
.correction-label{font-size:0.75rem;font-weight:800;color:var(--green-dark);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.multi-file{display:flex;flex-direction:column;gap:12px;}
.file-label{font-size:0.7rem;font-weight:800;color:#0369a1;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.code-block{background:#1e1e2e;border-radius:12px;padding:18px;overflow-x:auto;margin:10px 0;position:relative;}
.code-lang{position:absolute;top:10px;right:14px;font-size:0.65rem;color:#6c7086;font-family:'Fira Code',monospace;text-transform:uppercase;letter-spacing:0.1em;}
.code-block pre{font-family:'Fira Code',monospace;font-size:0.8rem;line-height:1.7;color:#cdd6f4;white-space:pre;}
.kw{color:#cba6f7;}.fn{color:#89b4fa;}.st{color:#a6e3a1;}.cm{color:#6c7086;font-style:italic;}.nm{color:#fab387;}.op{color:#89dceb;}
.ai-section{margin-top:20px;background:linear-gradient(135deg,#f0fdf4,#e0f2fe);border:2px solid var(--green);border-radius:14px;padding:20px;}
.ai-search-wrap{display:flex;gap:10px;}
.ai-input{flex:1;padding:10px 16px;border:2px solid var(--green);border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.88rem;outline:none;color:var(--gray-700);background:white;}
.ai-input:focus{border-color:var(--blue-dark);}
.ai-btn{padding:10px 18px;background:linear-gradient(135deg,var(--green),var(--blue-dark));color:white;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.ai-btn:disabled{opacity:0.5;cursor:not-allowed;}
.ai-response{display:none;margin-top:14px;background:white;border-radius:10px;padding:14px;font-size:0.85rem;line-height:1.7;color:var(--gray-700);border:1px solid var(--gray-200);white-space:pre-wrap;}
.ai-response.visible{display:block;animation:fadeIn 0.3s ease;}
.ai-loading{display:none;color:var(--gray-500);font-size:0.82rem;margin-top:10px;font-weight:600;}
.ai-loading.visible{display:block;}
.no-results{text-align:center;padding:60px 20px;color:var(--gray-500);display:none;}
.sujet-card{background:white;border-radius:16px;margin-bottom:16px;box-shadow:var(--shadow);border:2px solid #e0f2fe;overflow:hidden;}
.sujet-header{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;user-select:none;background:linear-gradient(135deg,#e0f2fe,#f0fdf4);}
.sujet-icon{font-size:1.4rem;}
.sujet-info{flex:1;}
.sujet-title{font-size:0.95rem;font-weight:800;color:#0369a1;}
.sujet-sub{font-size:0.75rem;color:var(--gray-500);margin-top:2px;}
.sujet-chevron{color:#0369a1;font-size:0.8rem;transition:transform 0.3s;}
.sujet-card.open .sujet-chevron{transform:rotate(180deg);}
.sujet-body{display:none;border-top:2px solid #e0f2fe;padding:20px;font-size:0.85rem;line-height:1.75;color:var(--gray-700);}
.sujet-card.open .sujet-body{display:block;}
.sujet-body h3{font-size:0.9rem;font-weight:800;color:#0369a1;margin:14px 0 6px;border-left:3px solid #38bdf8;padding-left:8px;}
.sujet-body h4{font-size:0.82rem;font-weight:700;color:var(--gray-700);margin:10px 0 4px;}
.sujet-body p{margin-bottom:8px;}
.sujet-body ul{margin-left:18px;margin-bottom:8px;}
.sujet-body li{margin-bottom:3px;}
.sujet-body code{background:#e0f2fe;color:#0284c7;padding:1px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:0.82em;}
.sujet-body .math{font-style:italic;color:#374151;}
.sujet-sep{border:none;border-top:1px solid #e0f2fe;margin:12px 0;}
.tp-group-header{display:flex;align-items:center;gap:10px;padding:6px 0 10px;margin-top:8px;}
.tp-group-label{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-500);}
.no-results.visible{display:block;}
.no-results-emoji{font-size:3rem;margin-bottom:12px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:768px){.layout{flex-direction:column;padding:0 16px 40px;}.sidebar{width:100%;position:static;}.ai-search-wrap{flex-direction:column;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="logo">🎓 Révision TP UNICA</div>
    <div class="score-badge">🔥 <span id="scoreCount">0</span> résolus</div>
  </div>
  <h1>Révise Python &amp; C++ M1 IM-MFA 🚀</h1>
  <p>Tous les exercices des TP1–TP4 Python et C++ TP1–TP5 · Corrections complètes</p>
  <div class="header-badges">
    <div class="header-badge">🐍 Python</div>
    <div class="header-badge">⚡ C++</div>
    <div class="header-badge">📚 TP1·TP2·TP3·TP4·TP5</div>
    <div class="header-badge">✅ Corrections incluses</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="Tape : fibonacci, EDO, dichotomie, MyVector, dotprod, resize, theNode..."
      oninput="filterExos()">
  </div>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="card">
      <div class="card-title">📊 Progression</div>
      <div class="prog-row"><span>Vus</span><span id="vuCount">0/39</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-counts">
        <div><div class="prog-num green" id="resolusNum">0</div><div class="prog-label">Résolus</div></div>
        <div><div class="prog-num gray" id="totalNum">39</div><div class="prog-label">Total</div></div>
      </div>
    </div>
    <div class="card"><div class="card-title">📁 Catégories</div><div id="catList"></div></div>
  </aside>
  <main class="main">
    <div class="results-count" id="resultsCount"></div>
    <div id="exoList"></div>
    <div class="no-results" id="noResults">
      <div class="no-results-emoji">🔍</div>
      <div>Aucun exercice trouvé pour "<span id="noResultsTerm"></span>"</div>
    </div>
  </main>
</div>
<script>
const WORKER_URL='https://gemini-proxy.mattia-malherbe.workers.dev';
const exos=[
{id:1,num:'#01',lang:'py',tp:'tp1',title:"Conversion de l'heure",tags:['Python','TP1','Facile'],keywords:['conversion','heure','secondes','jours','minutes','conv_heure'],enonce:`<strong>[TP1-1]</strong> Créer <code>conv_heure(t)</code> qui prend un nombre de secondes et retourne une chaîne au format <em>jours, heures, minutes, secondes</em>.<br>Ex: <code>conv_heure(3601)</code> → '0 jours, 1 heures, 0 minutes, 1 secondes'`,correction:`<span class="kw">def</span> <span class="fn">conv_heure</span>(t):\n    jours    = t <span class="op">//</span> <span class="nm">86400</span>\n    reste    = t <span class="op">%</span>  <span class="nm">86400</span>\n    heures   = reste <span class="op">//</span> <span class="nm">3600</span>\n    reste    = reste <span class="op">%</span>  <span class="nm">3600</span>\n    minutes  = reste <span class="op">//</span> <span class="nm">60</span>\n    secondes = reste <span class="op">%</span>  <span class="nm">60</span>\n    <span class="kw">return</span> (<span class="st">f"{t} secondes correspondent à {jours} jours, "</span>\n            <span class="st">f"{heures} heures, {minutes} minutes, {secondes} secondes"</span>)`,lang_code:'python',ai:false},
{id:2,num:'#02',lang:'py',tp:'tp1',title:"Chaînes de caractères — Verlaine",tags:['Python','TP1','Facile'],keywords:['chaine','string','split','replace','caracteres','texte'],enonce:`<strong>[TP1-2]</strong> Manipuler un texte poétique : compter les caractères, découper avec <code>split()</code>, remplacer "jours"→"temps" et "automne"→"hiver".`,correction:`T = <span class="st">"Les sanglots longs des violons de l'automne..."</span>\n<span class="kw">print</span>(<span class="st">"Caractères:"</span>, <span class="fn">len</span>(T))\nL = T.<span class="fn">split</span>()\n<span class="kw">print</span>(<span class="st">"Mots:"</span>, <span class="fn">len</span>(L))\nT1 = T.<span class="fn">replace</span>(<span class="st">"jours"</span>, <span class="st">"temps"</span>).<span class="fn">replace</span>(<span class="st">"automne"</span>, <span class="st">"hiver"</span>)\n<span class="kw">print</span>(T1)`,lang_code:'python',ai:false},
{id:3,num:'#03',lang:'py',tp:'tp1',title:"Dictionnaire — Départements",tags:['Python','TP1','Facile'],keywords:['dictionnaire','dict','departement','tri','sorted','filtre'],enonce:`<strong>[TP1-3]</strong> Créer <code>depart</code> nom→numéro. Filtrer valeurs &lt;30, trier, extraire clés avec ≥6 lettres triées par valeur.`,correction:`depart = {<span class="st">"Var"</span>:<span class="nm">83</span>, <span class="st">"Isere"</span>:<span class="nm">38</span>, <span class="st">"Drome"</span>:<span class="nm">26</span>, <span class="st">"Vaucluse"</span>:<span class="nm">84</span>, <span class="st">"Finistere"</span>:<span class="nm">29</span>, <span class="st">"Cher"</span>:<span class="nm">18</span>}\n\nv30 = [v <span class="kw">for</span> v <span class="kw">in</span> depart.<span class="fn">values</span>() <span class="kw">if</span> v <span class="op">&lt;</span> <span class="nm">30</span>]\n<span class="kw">print</span>(<span class="fn">sorted</span>(v30))\n\ncles6 = <span class="fn">sorted</span>([k <span class="kw">for</span> k <span class="kw">in</span> depart <span class="kw">if</span> <span class="fn">len</span>(k) <span class="op">&gt;=</span> <span class="nm">6</span>], key=<span class="kw">lambda</span> k: depart[k])\n<span class="kw">print</span>(cles6)`,lang_code:'python',ai:false},
{id:4,num:'#04',lang:'py',tp:'tp1',title:"Discrétisation",tags:['Python','TP1','Facile'],keywords:['discretisation','range','numpy','arange','linspace','intervalle'],enonce:`<strong>[TP1-4]</strong> Discrétiser [1,20[, [1,30], [0,100] pas 4, [30,...,0] inversé. Bonus: numpy.arange et linspace.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n\na = <span class="fn">range</span>(<span class="nm">1</span>, <span class="nm">20</span>)\nb = <span class="fn">range</span>(<span class="nm">1</span>, <span class="nm">31</span>)\nc = <span class="fn">range</span>(<span class="nm">0</span>, <span class="nm">101</span>, <span class="nm">4</span>)\nd = <span class="fn">range</span>(<span class="nm">30</span>, <span class="nm">-1</span>, <span class="nm">-1</span>)\ne = np.<span class="fn">arange</span>(<span class="nm">0</span>, <span class="nm">5.2</span>, <span class="nm">0.2</span>)\nf = np.<span class="fn">linspace</span>(<span class="nm">1</span>, <span class="nm">6</span>, <span class="nm">50</span>)`,lang_code:'python',ai:false},
{id:5,num:'#05',lang:'py',tp:'tp1',title:"Suite de Fibonacci",tags:['Python','TP1','Moyen'],keywords:['fibonacci','suite','liste'],enonce:`<strong>[TP1-5]</strong> Créer <code>fibonacci1(n)</code> retournant [u₀,...,uₙ]. Gérer n&lt;0, n=0, n=1.`,correction:`<span class="kw">def</span> <span class="fn">fibonacci1</span>(n):\n    <span class="kw">if</span> n <span class="op">&lt;</span> <span class="nm">0</span>: <span class="kw">return</span> []\n    <span class="kw">if</span> n <span class="op">==</span> <span class="nm">0</span>: <span class="kw">return</span> [<span class="nm">0</span>]\n    <span class="kw">if</span> n <span class="op">==</span> <span class="nm">1</span>: <span class="kw">return</span> [<span class="nm">0</span>, <span class="nm">1</span>]\n    fib = [<span class="nm">0</span>, <span class="nm">1</span>]\n    <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">2</span>, n<span class="op">+</span><span class="nm">1</span>):\n        fib.<span class="fn">append</span>(fib[<span class="nm">-1</span>] <span class="op">+</span> fib[<span class="nm">-2</span>])\n    <span class="kw">return</span> fib`,lang_code:'python',ai:false},
{id:6,num:'#06',lang:'py',tp:'tp1',title:"Racines polynôme degré 2",tags:['Python','TP1','Moyen'],keywords:['polynome','racine','discriminant','delta','solve2'],enonce:`<strong>[TP1-6]</strong> <code>solve2([a,b,c])</code> : racines réelles de ax²+bx+c. Gérer Δ&gt;0, Δ=0, Δ&lt;0.`,correction:`<span class="kw">import</span> math\n\n<span class="kw">def</span> <span class="fn">solve2</span>(coeffs):\n    a, b, c = coeffs\n    delta = b<span class="op">**</span><span class="nm">2</span> <span class="op">-</span> <span class="nm">4</span><span class="op">*</span>a<span class="op">*</span>c\n    <span class="kw">if</span> delta <span class="op">&gt;</span> <span class="nm">0</span>:\n        x1 = (<span class="op">-</span>b <span class="op">-</span> math.<span class="fn">sqrt</span>(delta)) <span class="op">/</span> (<span class="nm">2</span><span class="op">*</span>a)\n        x2 = (<span class="op">-</span>b <span class="op">+</span> math.<span class="fn">sqrt</span>(delta)) <span class="op">/</span> (<span class="nm">2</span><span class="op">*</span>a)\n        <span class="kw">return</span> [x1, x2]\n    <span class="kw">elif</span> delta <span class="op">==</span> <span class="nm">0</span>:\n        <span class="kw">return</span> [<span class="op">-</span>b <span class="op">/</span> (<span class="nm">2</span><span class="op">*</span>a)]\n    <span class="kw">return</span> []`,lang_code:'python',ai:false},
{id:7,num:'#07',lang:'py',tp:'tp1',title:"Dichotomie",tags:['Python','TP1','Difficile'],keywords:['dichotomie','dicho','zero','racine','algorithme'],enonce:`<strong>[TP1-7]</strong> Implémenter <code>dicho(f, a, b, kmax=50)</code> avec eps=1e-8. Tester sur f1(x)=√(1+x³)−7 et f2(x)=x²−6x·sin(2x)+2.`,correction:`<span class="kw">import</span> math\n\n<span class="kw">def</span> <span class="fn">dicho</span>(f, a, b, kmax=<span class="nm">50</span>):\n    eps = <span class="nm">1e-8</span>\n    deb, fin = a, b\n    x = (a <span class="op">+</span> b) <span class="op">/</span> <span class="nm">2</span>\n    <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(kmax):\n        <span class="kw">if</span> <span class="fn">abs</span>(<span class="fn">f</span>(x)) <span class="op">&lt;=</span> eps: <span class="kw">break</span>\n        <span class="kw">if</span> <span class="fn">f</span>(deb) <span class="op">*</span> <span class="fn">f</span>(x) <span class="op">&lt;</span> <span class="nm">0</span>: fin = x\n        <span class="kw">else</span>: deb = x\n        x = (deb <span class="op">+</span> fin) <span class="op">/</span> <span class="nm">2</span>\n    <span class="kw">return</span> x`,lang_code:'python',ai:false},
{id:8,num:'#08',lang:'py',tp:'tp2',title:"Loi de Poisson",tags:['Python','TP2','Moyen'],keywords:['poisson','loi','probabilite','matplotlib','plot','lambda'],enonce:`<strong>[TP2-1]</strong> Calculer P(X=k) pour Poisson(λ). Tracer λ=11, 7, 5 avec marqueurs différents et légende.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np, math\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n\n<span class="kw">def</span> <span class="fn">poisson</span>(lam, n):\n    <span class="kw">return</span> np.<span class="fn">array</span>([lam<span class="op">**</span>k<span class="op">/</span>math.<span class="fn">factorial</span>(k)<span class="op">*</span>math.<span class="fn">exp</span>(<span class="op">-</span>lam) <span class="kw">for</span> k <span class="kw">in</span> <span class="fn">range</span>(n)])\n\nk = np.<span class="fn">arange</span>(<span class="nm">25</span>)\nplt.<span class="fn">plot</span>(k, <span class="fn">poisson</span>(<span class="nm">11</span>,<span class="nm">25</span>), <span class="st">'r-D'</span>, label=<span class="st">'λ=11'</span>)\nplt.<span class="fn">plot</span>(k, <span class="fn">poisson</span>(<span class="nm">7</span>,<span class="nm">25</span>),  <span class="st">'g-o'</span>, label=<span class="st">'λ=7'</span>)\nplt.<span class="fn">plot</span>(k, <span class="fn">poisson</span>(<span class="nm">5</span>,<span class="nm">25</span>),  <span class="st">'k-*'</span>, label=<span class="st">'λ=5'</span>)\nplt.<span class="fn">xlabel</span>(<span class="st">'k'</span>); plt.<span class="fn">ylabel</span>(<span class="st">'P'</span>); plt.<span class="fn">legend</span>(); plt.<span class="fn">show</span>()`,lang_code:'python',ai:false},
{id:9,num:'#09',lang:'py',tp:'tp2',title:"Jeu de données Iris",tags:['Python','TP2','Moyen'],keywords:['iris','donnees','nuage','histogramme','moyenne','mediane'],enonce:`<strong>[TP2-2]</strong> Charger iris.txt, nuages de points + lignes moyenne (jaune) et médiane (magenta), histogrammes 20 bins.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n\ndata = np.<span class="fn">loadtxt</span>(<span class="st">'iris.txt'</span>, delimiter=<span class="st">','</span>, skiprows=<span class="nm">1</span>, usecols=(<span class="nm">0</span>,<span class="nm">1</span>,<span class="nm">2</span>,<span class="nm">3</span>))\nnoms = [<span class="st">'Sepal.Length'</span>,<span class="st">'Sepal.Width'</span>,<span class="st">'Petal.Length'</span>,<span class="st">'Petal.Width'</span>]\nstyles = [<span class="st">'bo'</span>,<span class="st">'rd'</span>,<span class="st">'g*'</span>,<span class="st">'k.'</span>]\n<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">4</span>):\n    col = data[:, i]\n    plt.<span class="fn">figure</span>()\n    plt.<span class="fn">plot</span>(col, styles[i])\n    plt.<span class="fn">axhline</span>(np.<span class="fn">mean</span>(col), color=<span class="st">'y'</span>, label=<span class="st">'moyenne'</span>)\n    plt.<span class="fn">axhline</span>(np.<span class="fn">median</span>(col), color=<span class="st">'m'</span>, label=<span class="st">'médiane'</span>)\n    plt.<span class="fn">legend</span>(); plt.<span class="fn">show</span>()`,lang_code:'python',ai:false},

{id:11,num:'#11',lang:'py',tp:'tp2',title:"Matrice de covariance",tags:['Python','TP2','Difficile'],keywords:['covariance','matrice','valeur propre','vecteur propre','eig','pca'],enonce:`<strong>[TP2-5]</strong> Implémenter <code>covariance(M)</code>, valeurs/vecteurs propres, nuage + vecteurs propres rouge/vert.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n\n<span class="kw">def</span> <span class="fn">covariance</span>(M):\n    n, p = M.shape; C = np.<span class="fn">zeros</span>((p,p))\n    <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(p):\n        <span class="kw">for</span> j <span class="kw">in</span> <span class="fn">range</span>(p):\n            C[i,j] = np.<span class="fn">sum</span>((M[:,i]-M[:,i].<span class="fn">mean</span>())<span class="op">*</span>(M[:,j]-M[:,j].<span class="fn">mean</span>()))<span class="op">/</span>(n<span class="op">-</span><span class="nm">1</span>)\n    <span class="kw">return</span> C\n\nM = np.<span class="fn">loadtxt</span>(<span class="st">'Matrice.txt'</span>)\nC = <span class="fn">covariance</span>(M)\nval, vec = np.linalg.<span class="fn">eig</span>(C)\nl1,l2 = val.<span class="fn">max</span>(),val.<span class="fn">min</span>()\nvarM = np.<span class="fn">var</span>(M)\nv1 = vec[:,val.<span class="fn">argmax</span>()]<span class="op">*</span>varM<span class="op">*</span>l1<span class="op">/</span>(l1<span class="op">+</span>l2)\nv2 = vec[:,val.<span class="fn">argmin</span>()]<span class="op">*</span>varM<span class="op">*</span>l2<span class="op">/</span>(l1<span class="op">+</span>l2)\nm = M.<span class="fn">mean</span>(axis=<span class="nm">0</span>)\nplt.<span class="fn">scatter</span>(M[:,<span class="nm">0</span>],M[:,<span class="nm">1</span>],s=<span class="nm">1</span>,alpha=<span class="nm">0.3</span>)\nplt.<span class="fn">quiver</span>(<span class="op">*</span>m,<span class="op">*</span>v1,color=<span class="st">'r'</span>,scale=<span class="nm">1</span>,scale_units=<span class="st">'xy'</span>)\nplt.<span class="fn">quiver</span>(<span class="op">*</span>m,<span class="op">*</span>v2,color=<span class="st">'g'</span>,scale=<span class="nm">1</span>,scale_units=<span class="st">'xy'</span>)\nplt.<span class="fn">show</span>()`,lang_code:'python',ai:false},
{id:12,num:'#12',lang:'py',tp:'tp3',title:"Matrices NumPy — matM et matN",tags:['Python','TP3','Difficile'],keywords:['matrice','numpy','matM','matN','bloc','diagonale','trace'],enonce:`<strong>[TP3-1]</strong> Construire <code>matM(k)</code> matrice 4×4, puis <code>matN(n,k0,j0)</code> bloc-diagonale avec ligne/colonne spéciales.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n\n<span class="kw">def</span> <span class="fn">matM</span>(k):\n    <span class="kw">return</span> np.<span class="fn">array</span>([\n        [<span class="nm">2</span><span class="op">*</span>k<span class="op">+</span><span class="nm">1</span>,<span class="op">-</span><span class="nm">5</span>,<span class="nm">0</span>,k],[<span class="op">-</span><span class="nm">5</span>,<span class="nm">3</span><span class="op">*</span>k<span class="op">+</span><span class="nm">2</span>,<span class="op">-</span>k<span class="op">+</span><span class="nm">3</span>,<span class="nm">0</span>],\n        [<span class="nm">0</span>,<span class="op">-</span><span class="nm">1</span>,<span class="nm">3</span><span class="op">*</span>k<span class="op">-</span><span class="nm">2</span>,<span class="nm">1</span>],[k,<span class="nm">3</span>,<span class="nm">1</span>,<span class="nm">7</span><span class="op">*</span>k<span class="op">-</span><span class="nm">3</span>]], dtype=<span class="fn">float</span>)\n\n<span class="kw">def</span> <span class="fn">matN</span>(n, k0, j0):\n    N = np.<span class="fn">zeros</span>((n,n))\n    <span class="kw">for</span> k <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">0</span>,n,<span class="nm">4</span>): N[k:k<span class="op">+</span><span class="nm">4</span>,k:k<span class="op">+</span><span class="nm">4</span>] = <span class="fn">matM</span>(k<span class="op">//</span><span class="nm">4</span>)\n    bloc = (k0<span class="op">//</span><span class="nm">4</span><span class="op">+</span><span class="nm">1</span>)<span class="op">*</span><span class="nm">4</span>\n    N[k0, bloc:] = <span class="nm">8</span>; N[bloc:, j0] = <span class="nm">6</span>\n    <span class="kw">return</span> N\n\n<span class="kw">print</span>(<span class="fn">matN</span>(<span class="nm">8</span>,<span class="nm">1</span>,<span class="nm">2</span>).astype(<span class="fn">int</span>))\n<span class="kw">print</span>(np.<span class="fn">trace</span>(<span class="fn">matN</span>(<span class="nm">12</span>,<span class="nm">7</span>,<span class="nm">4</span>)))`,lang_code:'python',ai:false},
{id:13,num:'#13',lang:'py',tp:'tp3',title:"Classe Droite2d",tags:['Python','TP3','Difficile'],keywords:['classe','droite','droite2d','intersection','plot','oop','poo','__str__','__eq__'],enonce:`<strong>[TP3-2]</strong> Classe <code>Droite2d</code> avec v, color, style. Méthodes : <code>__str__</code>, <code>__eq__</code>, <code>plot</code>, <code>intersect</code>.`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n\n<span class="kw">class</span> <span class="fn">Droite2d</span>:\n    <span class="kw">def</span> <span class="fn">__init__</span>(self, v=<span class="kw">None</span>, color=<span class="st">"b"</span>, style=<span class="st">"-"</span>):\n        self.v = np.<span class="fn">array</span>(v) <span class="kw">if</span> v <span class="kw">is not None else</span> np.<span class="fn">array</span>([<span class="nm">0</span>,<span class="nm">0</span>])\n        self.color=color; self.style=style\n\n    <span class="kw">def</span> <span class="fn">__str__</span>(self):\n        <span class="kw">return</span> <span class="st">f"Droite d'équation y = {self.v[0]:.2f}*x + {self.v[1]:.2f}"</span>\n\n    <span class="kw">def</span> <span class="fn">__eq__</span>(self, other):\n        <span class="kw">return</span> np.<span class="fn">max</span>(np.<span class="fn">abs</span>(self.v<span class="op">-</span>other.v)) <span class="op">&lt;</span> <span class="nm">1e-8</span>\n\n    <span class="kw">def</span> <span class="fn">plot</span>(self):\n        x = np.<span class="fn">linspace</span>(<span class="op">-</span><span class="nm">10</span>,<span class="nm">10</span>,<span class="nm">200</span>)\n        plt.<span class="fn">plot</span>(x, self.v[<span class="nm">0</span>]<span class="op">*</span>x<span class="op">+</span>self.v[<span class="nm">1</span>], color=self.color, ls=self.style)\n\n    <span class="kw">def</span> <span class="fn">intersect</span>(self, other):\n        <span class="kw">if</span> np.<span class="fn">isclose</span>(self.v[<span class="nm">0</span>],other.v[<span class="nm">0</span>]): <span class="kw">return</span> np.<span class="fn">array</span>([])\n        x=(other.v[<span class="nm">1</span>]-self.v[<span class="nm">1</span>])<span class="op">/</span>(self.v[<span class="nm">0</span>]-other.v[<span class="nm">0</span>])\n        <span class="kw">return</span> np.<span class="fn">array</span>([x, self.v[<span class="nm">0</span>]<span class="op">*</span>x<span class="op">+</span>self.v[<span class="nm">1</span>]])`,lang_code:'python',ai:false},
{id:14,num:'#14',lang:'py',tp:'tp3',title:"Classe PWF — Fonctions P0 par morceaux",tags:['Python','TP3','Difficile'],keywords:['pwf','piecewise','morceaux','integrate','double_y','double_v','scalaire','mul'],enonce:`<strong>[TP3-3]</strong> Créer <code>PWF(y, v)</code> avec y, v, taille.<br>• <code>__str__</code> : taille, intervalle, min/max<br>• <code>__mul__ / __rmul__</code> par scalaire<br>• <code>integrate()</code> = Σvᵢ(yᵢ₊₁−yᵢ)<br>• [fac] plot avec double_y et double_v`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n\n<span class="kw">class</span> <span class="fn">PWF</span>:\n    <span class="kw">def</span> <span class="fn">__init__</span>(self, y, v):\n        self.y=np.<span class="fn">array</span>(y); self.v=np.<span class="fn">array</span>(v)\n        self.taille=<span class="fn">len</span>(y)\n\n    <span class="kw">def</span> <span class="fn">__str__</span>(self):\n        <span class="kw">return</span> (<span class="st">f"Fonction constante par morceaux de taille {self.taille},\n"</span>\n                <span class="st">f"définie sur [{self.y[0]:f},{self.y[-1]:f}], "</span>\n                <span class="st">f"min {self.v.min():f} et max {self.v.max():f}"</span>)\n\n    <span class="kw">def</span> <span class="fn">__mul__</span>(self, s): <span class="kw">return</span> <span class="fn">PWF</span>(self.y.<span class="fn">copy</span>(), self.v<span class="op">*</span>s)\n    <span class="kw">def</span> <span class="fn">__rmul__</span>(self, s): <span class="kw">return</span> self.<span class="fn">__mul__</span>(s)\n\n    <span class="kw">def</span> <span class="fn">integrate</span>(self):\n        <span class="kw">return</span> <span class="fn">sum</span>(self.v[i]<span class="op">*</span>(self.y[i<span class="op">+</span><span class="nm">1</span>]-self.y[i]) <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(self.taille<span class="op">-</span><span class="nm">1</span>))\n\n    <span class="kw">def</span> <span class="fn">plot</span>(self, ls=<span class="st">'-'</span>, color=<span class="st">'b'</span>):\n        plt.<span class="fn">plot</span>(<span class="fn">double_y</span>(self.y), <span class="fn">double_v</span>(self.v), ls=ls, color=color)\n\n<span class="kw">def</span> <span class="fn">double_y</span>(y):\n    res=[y[<span class="nm">0</span>]]\n    <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">1</span>,<span class="fn">len</span>(y)<span class="op">-</span><span class="nm">1</span>): res<span class="op">+=</span>[y[i],y[i]]\n    res.<span class="fn">append</span>(y[<span class="op">-</span><span class="nm">1</span>]); <span class="kw">return</span> res\n\n<span class="kw">def</span> <span class="fn">double_v</span>(v):\n    res=[]\n    <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="fn">len</span>(v)<span class="op">-</span><span class="nm">1</span>): res<span class="op">+=</span>[v[i],v[i]]\n    <span class="kw">return</span> res`,lang_code:'python',ai:true},
{id:15,num:'#15',lang:'py',tp:'tp4',title:"EDO ordre 1 — odeint",tags:['Python','TP4','Difficile'],keywords:['edo','odeint','scipy','differentielle','ordre1'],enonce:`<strong>[TP4-1.1]</strong> Résoudre 2·du/dt − 3u = (t+4)e^(3t/2), u(0)=−5. Solution exacte : u(t)=(t²/4+2t−5)e^(3t/2).`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n<span class="kw">from</span> scipy.integrate <span class="kw">import</span> odeint\n\n<span class="kw">def</span> <span class="fn">f</span>(u, t): <span class="kw">return</span> (<span class="nm">3</span><span class="op">*</span>u[<span class="nm">0</span>] <span class="op">+</span> (t<span class="op">+</span><span class="nm">4</span>)<span class="op">*</span>np.<span class="fn">exp</span>(<span class="nm">1.5</span><span class="op">*</span>t)) <span class="op">/</span> <span class="nm">2</span>\n<span class="kw">def</span> <span class="fn">uex</span>(t): <span class="kw">return</span> (<span class="nm">0.25</span><span class="op">*</span>t<span class="op">**</span><span class="nm">2</span> <span class="op">+</span> <span class="nm">2</span><span class="op">*</span>t <span class="op">-</span> <span class="nm">5</span>) <span class="op">*</span> np.<span class="fn">exp</span>(<span class="nm">1.5</span><span class="op">*</span>t)\n\nx = np.<span class="fn">linspace</span>(<span class="nm">0</span>, <span class="nm">3</span>, <span class="nm">21</span>)\nsol = <span class="fn">odeint</span>(f, [<span class="op">-</span><span class="nm">5</span>], x)\nplt.<span class="fn">plot</span>(x, <span class="fn">uex</span>(x), <span class="st">'b-'</span>, label=<span class="st">'Exacte'</span>)\nplt.<span class="fn">plot</span>(x, sol[:,<span class="nm">0</span>], <span class="st">'ro'</span>, label=<span class="st">'odeint'</span>)\nplt.<span class="fn">legend</span>(); plt.<span class="fn">show</span>()`,lang_code:'python',ai:false},
{id:16,num:'#16',lang:'py',tp:'tp4',title:"EDO ordre 2 — réduction d'ordre",tags:['Python','TP4','Difficile'],keywords:['edo','ordre2','reduction','odeint','systeme'],enonce:`<strong>[TP4-1.2]</strong> d²y/dt²−4y=0, y(0)=2, y'(0)=−1. Exacte: (3/4)e^(2t)+(5/4)e^(-2t). Poser Y=[y,y'].`,correction:`<span class="kw">def</span> <span class="fn">f2</span>(Y, t): <span class="kw">return</span> [Y[<span class="nm">1</span>], <span class="nm">4</span><span class="op">*</span>Y[<span class="nm">0</span>]]\n<span class="kw">def</span> <span class="fn">yex</span>(t): <span class="kw">return</span> <span class="nm">0.75</span><span class="op">*</span>np.<span class="fn">exp</span>(<span class="nm">2</span><span class="op">*</span>t) <span class="op">+</span> <span class="nm">1.25</span><span class="op">*</span>np.<span class="fn">exp</span>(<span class="op">-</span><span class="nm">2</span><span class="op">*</span>t)\n\nx = np.<span class="fn">linspace</span>(<span class="nm">0</span>, <span class="nm">2</span>, <span class="nm">21</span>)\nsol = <span class="fn">odeint</span>(f2, [<span class="nm">2</span>, <span class="op">-</span><span class="nm">1</span>], x)\nplt.<span class="fn">plot</span>(x, <span class="fn">yex</span>(x), <span class="st">'b-'</span>, label=<span class="st">'Exacte'</span>)\nplt.<span class="fn">plot</span>(x, sol[:,<span class="nm">0</span>], <span class="st">'ro'</span>, label=<span class="st">'odeint'</span>)\nplt.<span class="fn">legend</span>(); plt.<span class="fn">show</span>()`,lang_code:'python',ai:false},
{id:17,num:'#17',lang:'py',tp:'tp4',title:"TCL — Théorème Central Limite",tags:['Python','TP4','Difficile'],keywords:['tcl','theoreme','central','limite','poisson','normale','histogramme'],enonce:`<strong>[TP4-2]</strong> Simuler S₄₀ (somme 40 lois Poisson(8)), 2000 réalisations. Comparer histogramme avec densité N(nμ,σ²n).`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n<span class="kw">from</span> scipy.stats <span class="kw">import</span> norm\n\nn, M, mu = <span class="nm">40</span>, <span class="nm">2000</span>, <span class="nm">8</span>\nTX = np.random.<span class="fn">poisson</span>(mu, (n, M))\nSn = TX.<span class="fn">sum</span>(axis=<span class="nm">0</span>)\nplt.<span class="fn">hist</span>(Sn, bins=<span class="nm">50</span>, density=<span class="kw">True</span>, alpha=<span class="nm">0.7</span>)\nx = np.<span class="fn">linspace</span>(Sn.<span class="fn">min</span>(), Sn.<span class="fn">max</span>(), <span class="nm">100</span>)\nplt.<span class="fn">plot</span>(x, norm.<span class="fn">pdf</span>(x, n<span class="op">*</span>mu, np.<span class="fn">sqrt</span>(mu<span class="op">*</span>n)), <span class="st">'r-'</span>)\nplt.<span class="fn">show</span>()`,lang_code:'python',ai:false},
{id:18,num:'#18',lang:'py',tp:'tp4',title:"Intégration — Méthode des trapèzes",tags:['Python','TP4','Difficile'],keywords:['trapeze','integration','numerique','my_trapz','ordre','convergence','loglog'],enonce:`<strong>[TP4-3]</strong> Implémenter <code>my_trapz(f,a,b,n)</code>. Comparer avec quad. Étudier convergence log-log (ordre 2).`,correction:`<span class="kw">import</span> numpy <span class="kw">as</span> np\n<span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt\n<span class="kw">from</span> scipy.integrate <span class="kw">import</span> quad\n\n<span class="kw">def</span> <span class="fn">my_trapz</span>(f, a, b, n):\n    x = np.<span class="fn">linspace</span>(a, b, n); h=(b-a)/(n-<span class="nm">1</span>); fx=<span class="fn">f</span>(x)\n    <span class="kw">return</span> h<span class="op">*</span>(fx[<span class="nm">0</span>]<span class="op">/</span><span class="nm">2</span> <span class="op">+</span> fx[<span class="nm">1</span>:<span class="op">-</span><span class="nm">1</span>].<span class="fn">sum</span>() <span class="op">+</span> fx[<span class="op">-</span><span class="nm">1</span>]<span class="op">/</span><span class="nm">2</span>)\n\nf = <span class="kw">lambda</span> x: np.<span class="fn">exp</span>(<span class="op">-</span>x<span class="op">**</span><span class="nm">2</span>)<span class="op">*</span>np.<span class="fn">sin</span>(<span class="nm">3</span><span class="op">*</span>x) <span class="op">-</span> <span class="nm">4</span><span class="op">*</span>x<span class="op">*</span>np.<span class="fn">cos</span>(x<span class="op">**</span><span class="nm">2</span>) <span class="op">+</span> <span class="nm">2</span>\nIref, _ = <span class="fn">quad</span>(f, <span class="nm">0</span>, <span class="nm">10</span>)\nns = [<span class="nm">51</span>,<span class="nm">101</span>,<span class="nm">1001</span>,<span class="nm">5001</span>,<span class="nm">10001</span>]\nv1 = [<span class="fn">my_trapz</span>(f,<span class="nm">0</span>,<span class="nm">10</span>,n) <span class="kw">for</span> n <span class="kw">in</span> ns]\nvh = [<span class="nm">10</span><span class="op">/</span>(n<span class="op">-</span><span class="nm">1</span>) <span class="kw">for</span> n <span class="kw">in</span> ns]\nplt.<span class="fn">loglog</span>(vh, np.<span class="fn">abs</span>(np.<span class="fn">array</span>(v1)<span class="op">-</span>Iref))\nplt.<span class="fn">xlabel</span>(<span class="st">'h'</span>); plt.<span class="fn">title</span>(<span class="st">'Erreur en fonction de h'</span>); plt.<span class="fn">show</span>()`,lang_code:'python',ai:false},

{id:21,num:'#21',lang:'cpp',tp:'cpp1',title:"Racines polynôme — C++",tags:['C++','TP1','Moyen'],keywords:['polynome','racine','discriminant','sqrt','cmath'],enonce:`<strong>[C++TP1-4]</strong> Lire a, b, c et calculer les racines réelles de ax²+bx+c.`,correction:`<span class="kw">#include</span> <span class="st">&lt;iostream&gt;</span>\n<span class="kw">#include</span> <span class="st">&lt;cmath&gt;</span>\n<span class="kw">using namespace</span> std;\n<span class="fn">int</span> main() {\n    <span class="fn">double</span> a, b, c; cin <span class="op">&gt;&gt;</span> a <span class="op">&gt;&gt;</span> b <span class="op">&gt;&gt;</span> c;\n    <span class="fn">double</span> d = b<span class="op">*</span>b <span class="op">-</span> <span class="nm">4</span><span class="op">*</span>a<span class="op">*</span>c;\n    <span class="kw">if</span>(d <span class="op">&gt;</span> <span class="nm">0</span>)\n        cout <span class="op">&lt;&lt;</span> (<span class="op">-</span>b<span class="op">-</span>sqrt(d))<span class="op">/</span>(<span class="nm">2</span><span class="op">*</span>a) <span class="op">&lt;&lt;</span> <span class="st">" et "</span> <span class="op">&lt;&lt;</span> (<span class="op">-</span>b<span class="op">+</span>sqrt(d))<span class="op">/</span>(<span class="nm">2</span><span class="op">*</span>a) <span class="op">&lt;&lt;</span> endl;\n    <span class="kw">else if</span>(d <span class="op">==</span> <span class="nm">0</span>)\n        cout <span class="op">&lt;&lt;</span> <span class="st">"Racine double: "</span> <span class="op">&lt;&lt;</span> <span class="op">-</span>b<span class="op">/</span>(<span class="nm">2</span><span class="op">*</span>a) <span class="op">&lt;&lt;</span> endl;\n    <span class="kw">else</span> cout <span class="op">&lt;&lt;</span> <span class="st">"Pas de racine réelle"</span> <span class="op">&lt;&lt;</span> endl;\n    <span class="kw">return</span> <span class="nm">0</span>;\n}`,lang_code:'cpp',ai:false},
{id:22,num:'#22',lang:'cpp',tp:'cpp1',title:"Fonction puissance — myPow",tags:['C++','TP1','Moyen'],keywords:['puissance','mypow','exposant','negatif'],enonce:`<strong>[C++TP1-5]</strong> Implémenter <code>myPow(double x, int m)</code> gérant exposants positifs, négatifs et nuls.`,correction:`<span class="fn">double</span> myPow(<span class="fn">double</span> x, <span class="fn">int</span> m) {\n    <span class="kw">if</span>(m == <span class="nm">0</span>) <span class="kw">return</span> <span class="nm">1.0</span>;\n    <span class="fn">double</span> r = <span class="nm">1.0</span>; <span class="fn">int</span> e = (m<span class="op">&gt;</span><span class="nm">0</span>)?m:<span class="op">-</span>m;\n    <span class="kw">for</span>(<span class="fn">int</span> i=<span class="nm">0</span>; i<span class="op">&lt;</span>e; i++) r<span class="op">*=</span>x;\n    <span class="kw">return</span> (m<span class="op">&gt;</span><span class="nm">0</span>) ? r : <span class="nm">1.0</span><span class="op">/</span>r;\n}`,lang_code:'cpp',ai:false},

{id:24,num:'#24',lang:'cpp',tp:'cpp1',title:"Racine carrée — Méthode de Héron",tags:['C++','TP1','Difficile'],keywords:['heron','racine','mysqrt','iteration','convergence'],enonce:`<strong>[C++TP1-8]</strong> Implémenter <code>mySqrt(double x)</code> par la méthode de Héron (xₙ₊₁=(xₙ+x/xₙ)/2), sans <code>sqrt</code>.`,correction:`<span class="fn">double</span> mySqrt(<span class="fn">double</span> x) {\n    <span class="kw">if</span>(x<span class="op">&lt;</span><span class="nm">0</span>) { cout<span class="op">&lt;&lt;</span><span class="st">"Erreur"</span>; <span class="kw">return</span> <span class="op">-</span><span class="nm">1</span>; }\n    <span class="kw">if</span>(x<span class="op">==</span><span class="nm">0</span>) <span class="kw">return</span> <span class="nm">0</span>;\n    <span class="fn">double</span> xn=x, eps=<span class="nm">1e-12</span>;\n    <span class="kw">while</span>(<span class="kw">true</span>) {\n        <span class="fn">double</span> xn1 = <span class="nm">0.5</span><span class="op">*</span>(xn <span class="op">+</span> x<span class="op">/</span>xn);\n        <span class="kw">if</span>(xn1-xn<eps && xn-xn1<eps) <span class="kw">break</span>;\n        xn=xn1;\n    }\n    <span class="kw">return</span> xn;\n}`,lang_code:'cpp',ai:false},

{id:26,num:'#26',lang:'cpp',tp:'cpp2',title:"Tableaux de double — statistiques",tags:['C++','TP2','Difficile'],keywords:['tableau','pointeur','moyenne','variance','ecart','printstats','new','rand'],enonce:`<strong>[C++TP2-2]</strong> Fonctions <code>moyenne</code>, <code>variance</code>, <code>ecart</code>, <code>printStats</code>, <code>array_rand</code>, <code>array_expo</code> avec pointeurs et <code>new</code>.`,correction:`<span class="fn">double</span> moyenne(<span class="fn">double</span><span class="op">*</span> t, <span class="fn">int</span> n) {\n    <span class="fn">double</span> s=<span class="nm">0</span>; <span class="kw">for</span>(<span class="fn">int</span> i=<span class="nm">0</span>;i<span class="op">&lt;</span>n;i++) s+=t[i]; <span class="kw">return</span> s/n;\n}\n<span class="fn">double</span> variance(<span class="fn">double</span><span class="op">*</span> t, <span class="fn">int</span> n) {\n    <span class="fn">double</span> m=moyenne(t,n), s=<span class="nm">0</span>;\n    <span class="kw">for</span>(<span class="fn">int</span> i=<span class="nm">0</span>;i<span class="op">&lt;</span>n;i++) s+=(t[i]-m)<span class="op">*</span>(t[i]-m);\n    <span class="kw">return</span> s/n;\n}\n<span class="fn">double</span><span class="op">*</span> array_rand(<span class="fn">int</span> n) {\n    <span class="fn">double</span><span class="op">*</span> t = <span class="kw">new</span> <span class="fn">double</span>[n];\n    <span class="kw">for</span>(<span class="fn">int</span> i=<span class="nm">0</span>;i<span class="op">&lt;</span>n;i++) t[i]=(<span class="fn">double</span>)rand()/RAND_MAX;\n    <span class="kw">return</span> t;\n}\n<span class="fn">double</span><span class="op">*</span> array_expo(<span class="fn">int</span> n, <span class="fn">double</span> mu) {\n    <span class="fn">double</span><span class="op">*</span> t=array_rand(n);\n    <span class="kw">for</span>(<span class="fn">int</span> i=<span class="nm">0</span>;i<span class="op">&lt; {label:'MyVector.cpp',lang_code:'cpp',code:`<span class="kw">#include</span> <span class="st">"MyVector.hh"</span>\n\n<span class="cm">// Constructeur 1 : n éléments initialisés à 0</span>\nMyVector::MyVector(<span class="fn">unsigned int</span> n) : _n(n), _v(<span class="kw">new</span> <span class="fn">double</span>[n]()) {}\n\n<span class="cm">// Constructeur 2 : copie depuis un tableau externe</span>\nMyVector::MyVector(<span class="fn">unsigned int</span> n, <span class="fn">double</span><span class="op">*</span> data) : _n(n), _v(<span class="kw">new</span> <span class="fn">double</span>[n]) {\n    <span class="kw">for</span> (<span class="fn">unsigned int</span> i = <span class="nm">0</span>; i <span class="op">&lt;</span> _n; i++)\n        _v[i] = data[i];\n}\n\n<span class="cm">// Constructeur de copie (copie profonde)</span>\nMyVector::MyVector(<span class="kw">const</span> MyVector<span class="op">&amp;</span> other) : _n(other._n), _v(<span class="kw">new</span> <span class="fn">double</span>[other._n]) {\n    <span class="kw">for</span> (<span class="fn">unsigned int</span> i = <span class="nm">0</span>; i <span class="op">&lt;</span> _n; i++)\n        _v[i] = other._v[i];\n}\n\n<span class="cm">// Destructeur</span>\nMyVector::<span class="op">~</span>MyVector() { <span class="kw">delete</span>[] _v; }`},
{label:'main.cpp',lang_code:'cpp',code:`<span class="kw">#include</span> <span class="st">&lt;iostream&gt;</span>\n<span class="kw">#include</span> <span class="st">"MyVector.hh"</span>\n<span class="kw">using namespace</span> std;\n\n<span class="fn">int</span> main() {\n    MyVector v1(<span class="nm">3</span>);                          <span class="cm">// [0, 0, 0]</span>\n    <span class="fn">double</span> data[] = {<span class="nm">1.0</span>, <span class="nm">2.0</span>, <span class="nm">3.0</span>};\n    MyVector v2(<span class="nm">3</span>, data);                    <span class="cm">// [1, 2, 3]</span>\n    MyVector v3(v2);                          <span class="cm">// copie de v2</span>\n    <span class="kw">return</span> <span class="nm">0</span>;\n}`}

const sujets={
  tp1:{titre:'TP1 Python — Bases',sous:'simon.girel@univ-cotedazur.fr · gilles.scarella@univ-cotedazur.fr',contenu:`
<h3>1. Conversion de l'heure</h3>
<p>Dans <code>conv_heure.py</code>, créer une fonction <code>conv_heure(t)</code> prenant un nombre de secondes et retournant une chaîne au format <em>jours, heures, minutes, secondes</em>.</p>
<p>Exemple : <code>conv_heure(3601)</code> → <code>'3601 secondes correspondent à 0 jours, 1 heures, 0 minutes, 1 secondes'</code></p>
<hr class="sujet-sep">
<h3>2. Chaînes de caractères — Verlaine</h3>
<p>Dans <code>exo2.py</code>, à partir du texte "Les sanglots longs des violons de l'automne..." :</p>
<ul><li>Afficher le nombre de caractères</li><li>Découper avec <code>split()</code> et afficher la taille</li><li>Remplacer "jours"→"temps" et "automne"→"hiver"</li></ul>
<hr class="sujet-sep">
<h3>3. Dictionnaire — Départements</h3>
<p>Dans <code>dict_depart.py</code>, créer un dictionnaire <code>depart</code> (nom→numéro) contenant Var-83, Isere-38, Drome-26, Vaucluse-84, Finistere-29, Cher-18.</p>
<ul><li>Valeurs strictement &lt; 30 (triées)</li><li>Clés avec ≥ 6 lettres triées par valeur</li></ul>
<hr class="sujet-sep">
<h3>4. Discrétisation</h3>
<p>Dans <code>discretisation.py</code>, définir avec <code>range</code> :</p>
<ul><li><code>a</code> : [1, 20[ pas 1</li><li><code>b</code> : [1, 30] pas 1</li><li><code>c</code> : [0, 100] pas 4</li><li><code>d</code> : [30, …, 0] inversé</li><li>[Facultatif] <code>e</code> : numpy.arange [0,5] pas 0.2 ; <code>f</code> : linspace [1,6] 50 pts</li></ul>
<hr class="sujet-sep">
<h3>5. Suite de Fibonacci</h3>
<p>Dans <code>fibo.py</code>, créer <code>fibonacci1(n)</code> retournant la suite jusqu'à l'indice n. Gérer n&lt;0, n=0, n=1.</p>
<hr class="sujet-sep">
<h3>6. Racines d'un polynôme de degré 2</h3>
<p>Dans <code>solve2.py</code>, créer <code>solve2(coeffs)</code> retournant les racines réelles de ax²+bx+c. Gérer Δ&gt;0, Δ=0, Δ&lt;0.</p>
<hr class="sujet-sep">
<h3>7. Dichotomie</h3>
<p>Dans <code>dicho.py</code>, implémenter <code>dicho(f, a, b, kmax=50)</code> avec eps=1e-8.</p>
<p>Tester sur : <span class="math">f1(x) = √(1+x³)−7</span> sur [-1, 50] et <span class="math">f2(x) = x²−6x·sin(2x)+2</span> sur [-20, -4].</p>
<hr class="sujet-sep">
<h3>8. Géométrie [Facultatif]</h3>
<p>Fonction <code>Proj3D(u, v, w)</code> retournant la matrice de projection sur un plan P parallèlement à une droite D dans ℝ³.</p>`},

  tp2:{titre:'TP2 Python — NumPy & Matplotlib',sous:'simon.girel@univ-cotedazur.fr · gilles.scarella@univ-cotedazur.fr',contenu:`
<h3>1. Loi de Poisson</h3>
<p>Dans <code>exo1.py</code>, définir une fonction à deux arguments λ et n retournant un tableau numpy de taille n contenant P(X=k) pour k=0 à n-1.</p>
<p>Tracer pour λ=11 (rouge, diamant), λ=7 (vert, o), λ=5 (noir, *) avec légende et labels axes.</p>

<h3>5. Matrice de covariance</h3>

  tp3:{titre:'TP3 Python — Classes & POO',sous:'simon.girel@univ-cotedazur.fr · gilles.scarella@univ-cotedazur.fr',contenu:`
<h3>1. Matrices NumPy — matM et matN</h3>
<p>Dans <code>exo1.py</code>, définir <code>matM(k)</code> retournant la matrice 4×4 paramétrée par k, et <code>matN(n, k0, j0)</code> retournant une matrice bloc-diagonale de taille n×n avec :</p>

let activeCat='all',searchTerm='';
let resolved=new Set(JSON.parse(localStorage.getItem('rev')||'[]'));

function init(){buildCats();render();updateStats();}

function buildCats(){
  document.getElementById('catList').innerHTML=categories.map(c=>{
    const n=exos.filter(c.filter).length;
    return `<div class="cat-item ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">
      <div class="cat-left"><div class="cat-dot" style="background:${c.dot}"></div><span>${c.label}</span></div>
      <span class="cat-count">${n}</span></div>`;
  }).join('');
}

function setCat(id){activeCat=id;buildCats();render();}
function filterExos(){searchTerm=document.getElementById('searchInput').value.toLowerCase().trim();render();}

function getVis(){
  const cat=categories.find(c=>c.id===activeCat);
  return exos.filter(e=>{
    if(!cat.filter(e)) return false;
    if(!searchTerm) return true;
    return e.title.toLowerCase().includes(searchTerm)||
      e.keywords.some(k=>k.toLowerCase().includes(searchTerm))||
      e.tags.some(t=>t.toLowerCase().includes(searchTerm));
  });
}

function togSujet(tp){const c=document.getElementById('sc_'+tp);c.classList.toggle('open');}

function render(){
  const vis=getVis();
  const list=document.getElementById('exoList');
  const noR=document.getElementById('noResults');
  document.getElementById('resultsCount').textContent=`${vis.length} exercice${vis.length>1?'s':''}`;
  if(!vis.length){list.innerHTML='';noR.classList.add('visible');document.getElementById('noResultsTerm').textContent=searchTerm;return;}
  noR.classList.remove('visible');
  // Insérer carte sujet si on filtre par TP et qu'il existe un sujet
  const tpSujetOrder=['tp1','tp2','tp3','tp4','cpp5'];
  const tagMap={'Python':'tag-py','C++':'tag-cpp','TP1':'tag-tp1','TP2':'tag-tp2','TP3':'tag-tp3','TP4':'tag-tp4','TP5':'tag-tp5','Facile':'tag-easy','Moyen':'tag-medium','Difficile':'tag-hard'};
  // Grouper par TP pour insérer les sujets
  let html='';
  let lastTp=null;
  vis.forEach(e=>{
    if(e.tp!==lastTp){
      // Nouvelle section TP : insérer carte sujet si disponible
      if(sujets[e.tp]){
        const s=sujets[e.tp];
        html+=`<div class="sujet-card" id="sc_${e.tp}">
          <div class="sujet-header" onclick="togSujet('${e.tp}')">
            <div class="sujet-icon">📄</div>
            <div class="sujet-info">
              <div class="sujet-title">${s.titre}</div>
              <div class="sujet-sub">${s.sous}</div>
            </div>
            <div class="sujet-chevron">▼</div>
          </div>
          <div class="sujet-body">${s.contenu}</div>
        </div>`;
      }
      lastTp=e.tp;
    }
    const isR=resolved.has(e.id);
    const nc=e.lang==='py'?'py':'cpp';
    const tags=e.tags.map(t=>`<span class="tag ${tagMap[t]||''}">${t}</span>`).join('');
    let corrHTML='';
    if(e.multifile && e.files){
      corrHTML=`<div class="correction-label">✓ Correction</div><div class="multi-file">`+
        e.files.map(f=>`<div><div class="file-label">📄 ${f.label}</div><div class="code-block"><span class="code-lang">${f.lang_code}</span><pre>${f.code}</pre></div></div>`).join('')+
        `</div>`;
    } else {
      corrHTML=`<div class="correction-label">✓ Correction</div><div class="code-block"><span class="code-lang">${e.lang_code}</span><pre>${e.correction}</pre></div>`;
    }
    const aiH=e.ai?`<div class="ai-section">
      <div class="ai-search-wrap">
        <input class="ai-input" id="ai_${e.id}" type="text" placeholder="Pose une question..." onkeydown="if(event.key==='Enter')askAI(${e.id})">
        <button class="ai-btn" id="aib_${e.id}" onclick="askAI(${e.id})">Demander</button>
      </div>
      <div class="ai-loading" id="ail_${e.id}">Gemini réfléchit...</div>
      <div class="ai-response" id="air_${e.id}"></div>
    </div>`:'';
    html+=`<div class="exo-card" id="c${e.id}" onclick="tog(${e.id},event)">
      <div class="exo-header">
        <div class="exo-num ${nc}">${e.num}</div>
        <div class="exo-info">
          <div class="exo-title">${isR?'✅ ':''}${e.title}</div>
          <div class="exo-tags">${tags}</div>
        </div>
        <div class="exo-chevron">▼</div>
      </div>
      <div class="exo-body">
        <div class="enonce">${e.enonce}</div>
        <div class="btn-row">
          <button class="correction-btn" onclick="tCorr(${e.id},event)">👁 Voir la correction</button>
          <button class="resolve-btn ${isR?'resolved':''}" onclick="tRes(${e.id},event)">${isR?'✅ Résolu':'○ Marquer résolu'}</button>
        </div>
        <div class="correction-block" id="k${e.id}">${corrHTML}</div>
        ${aiH}
      </div>
    </div>`;
  });
  list.innerHTML=html;
}

function tog(id,e){if(e&&e.target.closest('button,input'))return;document.getElementById('c'+id).classList.toggle('open');updateStats();}
function tCorr(id,e){e.stopPropagation();const b=document.getElementById('k'+id);b.classList.toggle('visible');e.currentTarget.textContent=b.classList.contains('visible')?'🙈 Masquer':'👁 Voir la correction';}
function tRes(id,e){e.stopPropagation();resolved.has(id)?resolved.delete(id):resolved.add(id);localStorage.setItem('rev',JSON.stringify([...resolved]));render();updateStats();}

function updateStats(){
  const r=resolved.size,total=exos.length;
  document.getElementById('scoreCount').textContent=r;
  document.getElementById('resolusNum').textContent=r;
  document.getElementById('totalNum').textContent=total;
  document.getElementById('progFill').style.width=(r/total*100)+'%';
  const open=document.querySelectorAll('.exo-card.open').length;
  document.getElementById('vuCount').textContent=open+'/'+total;
}

async function askAI(id){
  const inp=document.getElementById('ai_'+id);
  const btn=document.getElementById('aib_'+id);
  const load=document.getElementById('ail_'+id);
  const resp=document.getElementById('air_'+id);
  const q=inp.value.trim(); if(!q)return;
  btn.disabled=true; load.classList.add('visible'); resp.classList.remove('visible');
  try{
    const exo=exos.find(e=>e.id===id);
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:`Tu es un professeur de programmation. Réponds UNIQUEMENT avec le code, sans aucune explication, sans aucun commentaire dans le code, sans texte avant ou après le code. Juste le code brut. Exercice concerné : "${exo.title}". Question de l'étudiant : ${q}`})});
    const data=await res.json();
    resp.textContent=data.answer||'Pas de réponse.'; resp.classList.add('visible');
  }catch(err){resp.textContent='Erreur de connexion au serveur Gemini.'; resp.classList.add('visible');}
  load.classList.remove('visible'); btn.disabled=false;
}

init();
</script>
</body>
